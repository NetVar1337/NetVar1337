<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">NetVar1337 — security, reverse engineering, and AI</title>
  <desc id="desc">A dark terminal-inspired banner. Build openly. Think adversarially. Verify the evidence.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#0b1120"/>
      <stop offset="1" stop-color="#131c30"/>
    </linearGradient>
    <linearGradient id="accent">
      <stop stop-color="#5eead4"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="20" fill="url(#grid)"/>
  <path d="M40 1H1160" stroke="url(#accent)" stroke-width="2"/>
  <g font-family="'DejaVu Sans Mono', monospace">
    <text x="58" y="65" fill="#5eead4" font-size="14" letter-spacing="3">SECURITY / RESEARCH / OPEN SOURCE</text>
    <text x="54" y="151" fill="#f1f5f9" font-size="68" font-weight="700" letter-spacing="-3">NetVar1337</text>
    <rect x="432" y="137" width="38" height="14" fill="#5eead4"/>
    <text x="58" y="199" fill="#cbd5e1" font-size="19">Build openly. Think adversarially.</text>
    <text x="58" y="230" fill="#cbd5e1" font-size="19">Verify the evidence.</text>
    <text x="58" y="279" fill="#94a3b8" font-size="14">FOUNDER / hashward</text>
    <text x="58" y="304" fill="#94a3b8" font-size="14">CO-FOUNDER / BitterSecurity</text>
    <g transform="translate(733 90)">
      <rect width="410" height="210" rx="12" fill="#080e1a" stroke="#334155"/>
      <path d="M0 38H410" stroke="#334155"/>
      <circle cx="20" cy="19" r="4" fill="#5eead4"/>
      <circle cx="36" cy="19" r="4" fill="#a78bfa"/>
      <circle cx="52" cy="19" r="4" fill="#64748b"/>
      <text x="24" y="77" fill="#5eead4" font-size="15">~ $ cat focus.txt</text>
      <g fill="#cbd5e1" font-size="14">
        <text x="24" y="112">01  understand the system</text>
        <text x="24" y="142">02  question the assumptions</text>
        <text x="24" y="172">03  make the work reproducible</text>
      </g>
    </g>
    <g font-size="12" text-anchor="middle">
      <rect x="58" y="341" width="142" height="30" rx="15" fill="#5eead4" fill-opacity=".09" stroke="#5eead4" stroke-opacity=".3"/>
      <text x="129" y="361" fill="#5eead4">CYBERSECURITY</text>
      <rect x="212" y="341" width="182" height="30" rx="15" fill="#a78bfa" fill-opacity=".09" stroke="#a78bfa" stroke-opacity=".3"/>
      <text x="303" y="361" fill="#c4b5fd">REVERSE ENGINEERING</text>
      <rect x="406" y="341" width="90" height="30" rx="15" fill="#5eead4" fill-opacity=".09" stroke="#5eead4" stroke-opacity=".3"/>
      <text x="451" y="361" fill="#5eead4">AI / ML</text>
      <rect x="508" y="341" width="198" height="30" rx="15" fill="#a78bfa" fill-opacity=".09" stroke="#a78bfa" stroke-opacity=".3"/>
      <text x="607" y="361" fill="#c4b5fd">SMART CONTRACTS / WEB3</text>
    </g>
