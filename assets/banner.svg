<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="hw-banner-title hw-banner-desc">
  <title id="hw-banner-title">NetVar1337 — security research, reverse engineering, AI/ML</title>
  <desc id="hw-banner-desc">Hashward brand banner: a vermilion reviewer's mark, the name NetVar1337, the line Build openly. Think adversarially. Verify the evidence., and a parchment field-notes sheet.</desc>

  <defs>
    <filter id="hw-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <style>
      .display { font-family: "Instrument Serif", "Iowan Old Style", Georgia, serif; }
      .body    { font-family: "Instrument Sans", "Avenir Next", "Segoe UI", sans-serif; }
      .code    { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- ink workspace -->
  <rect width="1200" height="400" fill="#0c0c0b"/>
  <rect width="1200" height="400" fill="#161614" opacity="0.5"/>
  <rect width="1200" height="400" filter="url(#hw-grain)" opacity="0.035"/>

  <!-- reviewer's mark + eyebrow -->
  <rect x="64" y="46" width="10" height="10" fill="#e24a2a"/>
  <text class="code" x="84" y="56" fill="#969084" font-size="11" letter-spacing="1.5">SECURITY RESEARCH · REVERSE ENGINEERING · OPEN SOURCE</text>

  <!-- wordmark -->
  <text class="display" x="60" y="146" fill="#f2efe8" font-size="78" letter-spacing="-1"
        textLength="368" lengthAdjust="spacing">NetVar1337</text>

  <!-- line -->
  <rect x="60" y="180" width="2" height="58" fill="#e24a2a"/>
  <text class="body" x="80" y="202" fill="#f2efe8" font-size="19">Build openly. Think adversarially.</text>
  <text class="body" x="80" y="230" fill="#ff886d" font-size="19">Verify the evidence.</text>

  <line x1="60" y1="256" x2="190" y2="256" stroke="#34332e" stroke-width="1"/>

  <!-- affiliations -->
  <text class="code" x="160" y="282" text-anchor="end" fill="#969084" font-size="10" letter-spacing="1.6">FOUNDER</text>
  <text class="code" x="176" y="282" fill="#b4aea2" font-size="12.5">hashward-io</text>
  <text class="code" x="160" y="304" text-anchor="end" fill="#969084" font-size="10" letter-spacing="1.6">CO-FOUNDER</text>
  <text class="code" x="176" y="304" fill="#b4aea2" font-size="12.5">BitterSecurity</text>

  <!-- domains -->
  <g class="code" font-size="11" letter-spacing=".8" text-anchor="middle">
    <rect x="60" y="326" width="117" height="30" rx="3" fill="none" stroke="#e24a2a" stroke-width="1"/>
    <text x="118.5" y="345" fill="#ff886d">CYBERSECURITY</text>

    <rect x="189" y="326" width="161" height="30" rx="3" fill="none" stroke="#34332e" stroke-width="1"/>
    <text x="269.5" y="345" fill="#b4aea2">REVERSE ENGINEERING</text>

    <rect x="362" y="326" width="87" height="30" rx="3" fill="none" stroke="#34332e" stroke-width="1"/>
    <text x="405.5" y="345" fill="#b4aea2">AI / ML</text>

    <rect x="461" y="326" width="191" height="30" rx="3" fill="none" stroke="#34332e" stroke-width="1"/>
    <text x="556.5" y="345" fill="#b4aea2">WEB3 / SMART CONTRACTS</text>
  </g>

  <!-- parchment sheet: back leaf, then the sheet itself -->
  <rect x="708" y="70" width="438" height="286" fill="#cfc8b6" transform="rotate(-1.6 927 213)"/>
  <g transform="rotate(1.1 913 204)">
    <rect x="690" y="52" width="446" height="304" fill="#f3efe4"/>

    <text class="code" x="714" y="84" fill="#645e53" font-size="10.5" letter-spacing="1.2">MH-2026-021</text>
    <text class="code" x="1112" y="84" text-anchor="end" fill="#645e53" font-size="10.5" letter-spacing="1.2">PRIVATE</text>
    <line x1="714" y1="98" x2="1112" y2="98" stroke="#ded7c6" stroke-width="1"/>

    <text class="display" x="714" y="136" fill="#1c1b17" font-size="32">focus.md</text>
    <text class="body" x="714" y="160" fill="#645e53" font-size="13.5">read before you patch</text>

    <line x1="714" y1="178" x2="1112" y2="178" stroke="#ded7c6" stroke-width="1"/>

    <!-- findings, one line marked -->
    <rect x="714" y="230" width="300" height="20" fill="#e24a2a" opacity="0.1"/>
    <rect x="714" y="230" width="2" height="20" fill="#e24a2a"/>
    <g class="code" font-size="11.5">
      <text x="732" y="200" text-anchor="end" fill="#645e53">42</text>
      <text x="744" y="200" fill="#3a3832">read the code, not the report</text>

      <text x="732" y="220" text-anchor="end" fill="#645e53">43</text>
      <text x="744" y="220" fill="#3a3832">reproduce it before you claim it</text>

      <text x="732" y="240" text-anchor="end" fill="#645e53">44</text>
      <text x="744" y="240" fill="#3a3832">the signer is not the author</text>

      <text x="732" y="260" text-anchor="end" fill="#645e53">45</text>
      <text x="744" y="260" fill="#3a3832">so the balance ends up wrong</text>
    </g>

    <text class="display" x="1032" y="234" fill="#ae301a" font-size="14" font-style="italic">evidence</text>
    <text class="display" x="1032" y="251" fill="#ae301a" font-size="14" font-style="italic">over</text>
    <text class="display" x="1032" y="268" fill="#ae301a" font-size="14" font-style="italic">assertions</text>

    <!-- finding -->
    <rect x="714" y="276" width="88" height="22" fill="none" stroke="#e24a2a" stroke-width="1.5"/>
    <text class="code" x="758" y="291" text-anchor="middle" fill="#ae301a" font-size="10" letter-spacing="1.8">VERIFIED</text>
    <text class="body" x="818" y="292" fill="#3a3832" font-size="13.5">Every claim has a command behind it.</text>

    <line x1="714" y1="310" x2="1112" y2="310" stroke="#ded7c6" stroke-width="1"/>
    <text class="code" x="714" y="330" fill="#645e53" font-size="11">repro first · then write · sign it</text>
  </g>
</svg>
