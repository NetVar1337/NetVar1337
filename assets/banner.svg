  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#475569">
    <text x="820" y="78">00  48 89 5C 24 08</text>
    <text x="820" y="96">08  48 89 74 24 10</text>
    <text x="820" y="114">10  57 48 83 EC 20</text>
    <text x="820" y="132" fill="#22D3EE">18  E8 __ RECON __</text>
    <text x="820" y="150" fill="#A78BFA">20  E8 __ TRIAGE __</text>
    <text x="820" y="168" fill="#F472B6">28  E8 __ REPORT __</text>
