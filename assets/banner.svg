<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">NetVar1337 — security research, reverse engineering, AI/ML</title>
  <desc id="banner-desc">A dark terminal-inspired banner with a blinking cursor and a focus manifest. Build openly. Think adversarially. Verify the evidence.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080D17"/>
      <stop offset=".55" stop-color="#0D1424"/>
      <stop offset="1" stop-color="#131C31"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#5EEAD4"/>
      <stop offset=".5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#F8FAFC"/>
      <stop offset=".62" stop-color="#DCE5F1"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#5EEAD4" stop-opacity="0"/>
      <stop offset=".5" stop-color="#7DD3FC" stop-opacity=".95"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx=".18" cy=".12" r=".62">
      <stop stop-color="#5EEAD4" stop-opacity=".16"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx=".92" cy=".94" r=".66">
      <stop stop-color="#A78BFA" stop-opacity=".2"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#94A3B8" stroke-opacity=".05"/>
    </pattern>
  </defs>

  <!-- canvas -->
  <rect width="1200" height="400" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="400" rx="16" fill="url(#glowTeal)"/>
  <rect width="1200" height="400" rx="16" fill="url(#glowViolet)"/>

  <!-- top rule + travelling highlight -->
  <rect x="44" y="0" width="1112" height="2" fill="url(#accent)" opacity=".85"/>
  <rect x="-220" y="0" width="220" height="2" fill="url(#sweep)">
    <animate attributeName="x" values="-220;1200" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- inspection frame -->
  <g fill="none" stroke="#22304A" stroke-width="1.5" stroke-linecap="square">
    <path d="M28 46V28H46"/>
    <path d="M1154 28H1172V46"/>
    <path d="M28 354V372H46"/>
    <path d="M1154 372H1172V354"/>
  </g>

  <!-- column rule -->
  <line x1="672" y1="58" x2="672" y2="342" stroke="#16203A" stroke-width="1"/>

  <g font-family="'SFMono-Regular', Consolas, 'DejaVu Sans Mono', 'Liberation Mono', Menlo, monospace">

    <!-- eyebrow -->
    <rect x="60" y="52" width="8" height="8" fill="#5EEAD4"/>
    <text x="80" y="61" fill="#5EEAD4" font-size="12" letter-spacing="3.4">SECURITY / RESEARCH / OPEN SOURCE</text>

    <!-- handle -->
    <text x="60" y="142" fill="url(#handle)" font-size="74" font-weight="800" letter-spacing="-2"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
          textLength="384" lengthAdjust="spacingAndGlyphs">NetVar1337</text>
    <rect x="450" y="98" width="15" height="42" fill="#5EEAD4">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.55;1" dur="1.15s" repeatCount="indefinite"/>
    </rect>

    <!-- tagline -->
    <text x="60" y="196" fill="#E2E8F0" font-size="19">Build openly. Think adversarially.</text>
    <text x="60" y="224" fill="#5EEAD4" font-size="19">Verify the evidence.</text>

    <line x1="60" y1="250" x2="188" y2="250" stroke="url(#accent)" stroke-width="2"/>

    <!-- affiliations -->
    <text x="160" y="281" text-anchor="end" fill="#5C6B85" font-size="10" letter-spacing="2">FOUNDER</text>
    <text x="176" y="281" fill="#CBD5E1" font-size="13">hashward-io</text>
    <text x="160" y="304" text-anchor="end" fill="#5C6B85" font-size="10" letter-spacing="2">CO-FOUNDER</text>
    <text x="176" y="304" fill="#CBD5E1" font-size="13">BitterSecurity</text>

    <!-- domain pills -->
    <g font-size="11" letter-spacing="1" text-anchor="middle">
      <rect x="60" y="322" width="122" height="30" rx="15" fill="#5EEAD4" fill-opacity=".09" stroke="#5EEAD4" stroke-opacity=".3"/>
      <text x="121" y="341" fill="#5EEAD4">CYBERSECURITY</text>

      <rect x="192" y="322" width="168" height="30" rx="15" fill="#A78BFA" fill-opacity=".09" stroke="#A78BFA" stroke-opacity=".3"/>
      <text x="276" y="341" fill="#C4B5FD">REVERSE ENGINEERING</text>

      <rect x="370" y="322" width="88" height="30" rx="15" fill="#5EEAD4" fill-opacity=".09" stroke="#5EEAD4" stroke-opacity=".3"/>
      <text x="414" y="341" fill="#5EEAD4">AI / ML</text>

      <rect x="468" y="322" width="200" height="30" rx="15" fill="#A78BFA" fill-opacity=".09" stroke="#A78BFA" stroke-opacity=".3"/>
      <text x="568" y="341" fill="#C4B5FD">SMART CONTRACTS / WEB3</text>
    </g>

    <!-- terminal panel -->
    <g>
      <rect x="700" y="58" width="440" height="294" rx="14" fill="#050A12" stroke="#1E293B" stroke-width="1"/>
      <line x1="700" y1="98" x2="1140" y2="98" stroke="#1E293B" stroke-width="1"/>

      <circle cx="722" cy="78" r="4.5" fill="#5EEAD4"/>
      <circle cx="738" cy="78" r="4.5" fill="#A78BFA"/>
      <circle cx="754" cy="78" r="4.5" fill="#3B4A63"/>
      <text x="1118" y="83" text-anchor="end" fill="#54637E" font-size="11">~/focus.txt</text>

      <text x="724" y="138" font-size="14"><tspan fill="#A78BFA">$</tspan><tspan fill="#5EEAD4"> cat focus.txt</tspan></text>

      <g font-size="14">
        <text x="724" y="178"><tspan fill="#3F4C66">01</tspan><tspan fill="#CBD5E1">  understand the system</tspan></text>
        <text x="724" y="210"><tspan fill="#3F4C66">02</tspan><tspan fill="#CBD5E1">  question the assumptions</tspan></text>
        <text x="724" y="242"><tspan fill="#3F4C66">03</tspan><tspan fill="#CBD5E1">  make the work reproducible</tspan></text>
        <text x="724" y="274"><tspan fill="#3F4C66">04</tspan><tspan fill="#CBD5E1">  report what the evidence shows</tspan></text>
      </g>

      <line x1="722" y1="298" x2="1118" y2="298" stroke="#16203A" stroke-width="1"/>
      <text x="724" y="326" font-size="12"><tspan fill="#5EEAD4">▸</tspan><tspan fill="#94A3B8"> evidence over assumptions</tspan></text>
    </g>
  </g>
</svg>
