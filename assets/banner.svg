<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="280" viewBox="0 0 1100 280" role="img" aria-label="NetVar — Reverse Engineer, Bug Bounty Hunter, Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090D"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1E293B" stroke-width="0.6"/>
    </pattern>
  </defs>

  <rect width="1100" height="280" rx="18" fill="url(#bg)"/>
  <rect width="1100" height="280" rx="18" fill="url(#grid)" opacity="0.45"/>
  <rect x="0" y="0" width="1100" height="4" rx="2" fill="url(#accent)"/>
  <rect x="0" y="4" width="320" height="180" fill="url(#glow)"/>

  <!-- monogram -->
  <g transform="translate(48, 58)">
    <rect width="92" height="92" rx="16" fill="#0B1220" stroke="#334155" stroke-width="1.5"/>
    <rect x="6" y="6" width="80" height="80" rx="12" fill="none" stroke="url(#accent)" stroke-width="1.2" opacity="0.9"/>
    <text x="46" y="64" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="36" font-weight="700" fill="#E2E8F0">NV</text>
  </g>

  <text x="168" y="96" font-family="ui-sans-serif, system-ui, Segoe UI, Inter, sans-serif" font-size="42" font-weight="700" fill="#F8FAFC" letter-spacing="1.5">NetVar</text>
  <text x="168" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#A78BFA">@NetVar1337</text>

  <text x="168" y="176" font-family="ui-sans-serif, system-ui, Segoe UI, Inter, sans-serif" font-size="18" fill="#CBD5E1">Reverse Engineer  ·  Bug Bounty Hunter  ·  Developer</text>
  <text x="168" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#64748B">Windows internals  ·  binary analysis  ·  Web2 / Web3 hunts  ·  agentic tooling</text>

