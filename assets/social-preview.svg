<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="NetVar1337 — security research, reverse engineering and open source">
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#0b1120"/>
      <stop offset="1" stop-color="#131c30"/>
    </linearGradient>
    <linearGradient id="accent" x2="1" y2="0">
      <stop stop-color="#5eead4"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity=".06"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#accent)"/>

  <g font-family="'DejaVu Sans Mono', 'Noto Sans Mono', monospace">
    <text x="72" y="118" fill="#5eead4" font-size="20" letter-spacing="5">SECURITY / REVERSE ENGINEERING / OPEN SOURCE</text>

    <text x="68" y="248" fill="#f1f5f9" font-size="104" font-weight="700" letter-spacing="-5">NetVar1337</text>
    <rect x="646" y="227" width="56" height="21" fill="#5eead4"/>

    <text x="72" y="308" fill="#cbd5e1" font-size="28">Build openly. Think adversarially. Verify the evidence.</text>

    <text x="72" y="368" fill="#94a3b8" font-size="20">Founder @ hashward · Co-founder @ BitterSecurity · Norway</text>

    <!-- stat strip -->
    <g transform="translate(72 430)">
      <rect width="1136" height="132" rx="16" fill="#080e1a" stroke="#1e293b"/>
      <g>
        <rect x="0" y="0" width="1136" height="3" rx="1.5" fill="url(#accent)"/>
        <text x="40" y="66" fill="#e2e8f0" font-size="46" font-weight="700">6.4k</text>
        <text x="40" y="96" fill="#94a3b8" font-size="16">Decepticon stars</text>

        <text x="330" y="66" fill="#e2e8f0" font-size="46" font-weight="700">30</text>
        <text x="330" y="96" fill="#94a3b8" font-size="16">public repos</text>

        <text x="560" y="66" fill="#e2e8f0" font-size="46" font-weight="700">817</text>
        <text x="560" y="96" fill="#94a3b8" font-size="16">commits</text>

        <text x="810" y="66" fill="#e2e8f0" font-size="46" font-weight="700">118</text>
        <text x="810" y="96" fill="#94a3b8" font-size="16">followers</text>
      </g>
    </g>

    <text x="72" y="616" fill="#64748b" font-size="17" letter-spacing="2">github.com/NetVar1337</text>
  </g>
</svg>
